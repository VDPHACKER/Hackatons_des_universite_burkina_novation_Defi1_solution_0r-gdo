<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu téléphone : Orẽgdo</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#dfe7e1;font-family:system-ui,sans-serif;color:#14281c}
  main{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;justify-content:center;padding:18px}
  .tel{width:400px;height:820px;border:10px solid #111;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 18px 50px #0004}
  iframe{width:100%;height:100%;border:0;display:block}
  nav{display:flex;flex-direction:column;gap:8px;min-width:190px}
  nav b{margin-bottom:4px}
  nav a{padding:10px 14px;border-radius:10px;background:#fff;color:#14281c;text-decoration:none;border:1px solid #b8c9bd;font-weight:600}
  nav a:hover,nav a:focus-visible{background:#1e7a46;color:#fff}
  p{max-width:190px;font-size:.85rem;color:#4a5e51}
</style>
</head>
<body>
<main>
  <div class="tel"><iframe id="cadre" src="./#/accueil" title="Application Orẽgdo dans un cadre de téléphone (400 px)"></iframe></div>
  <nav aria-label="Écrans à vérifier">
    <b>Aller à l'écran</b>
    <a href="#" data-r="accueil">Accueil</a><a href="#" data-r="carte">Carte</a><a href="#" data-r="signaler">Signaler</a><a href="#" data-r="suivi">Suivi</a>
    <a href="#" data-r="connexion">Connexion</a><a href="#" data-r="precollecteur">Pré-collecteur</a><a href="#" data-r="brigade">Brigade</a><a href="#" data-r="mairie">Mairie</a>
    <p>Cadre de 400 px de large, comme un téléphone. Le GPS et le micro dépendent du navigateur, pas du cadre : pour les tester, ouvrez le lien sur un vrai téléphone.</p>
  </nav>
</main>
<script>
  document.querySelectorAll('nav a[data-r]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); document.getElementById('cadre').contentWindow.location.hash = '#/' + a.dataset.r; });
  });
</script>
</body>
</html>
